name: public-release-ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/requirements.txt
          python -m pip install -e .
      - name: Run release safety audit before inventory closure
        run: python scripts/audit_release.py --pre-manifest --output "$RUNNER_TEMP/green-methanol-pre-manifest-audit.json"
      - name: Run full public test suite
        run: python -m pytest -q
      - name: Run full public reproduction twice
        run: |
          python scripts/reproduce.py --mode full --output "$RUNNER_TEMP/green-methanol-full-1/full_reproduction.json"
          python scripts/reproduce.py --mode full --output "$RUNNER_TEMP/green-methanol-full-2/full_reproduction.json"
          cmp --silent "$RUNNER_TEMP/green-methanol-full-1/full_reproduction.json" "$RUNNER_TEMP/green-methanol-full-2/full_reproduction.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          first = json.loads((temp / "green-methanol-full-1" / "full_reproduction.json").read_text())
          second = json.loads((temp / "green-methanol-full-2" / "full_reproduction.json").read_text())
          assert first["artifacts"] == second["artifacts"]
          assert first["executed_output_ids"] == second["executed_output_ids"]
          PY
      - name: Verify reproduction leaves the committed payload unchanged
        run: git diff --exit-code
      - name: Regenerate and verify deterministic release inventories
        run: |
          python scripts/build_manifest.py
          cp FILE_MANIFEST.csv "$RUNNER_TEMP/green-methanol-manifest-first.csv"
          cp CHECKSUMS.sha256 "$RUNNER_TEMP/green-methanol-checksums-first.sha256"
          python scripts/build_manifest.py
          cmp --silent FILE_MANIFEST.csv "$RUNNER_TEMP/green-methanol-manifest-first.csv"
          cmp --silent CHECKSUMS.sha256 "$RUNNER_TEMP/green-methanol-checksums-first.sha256"
          git diff --check
          git diff --exit-code -- FILE_MANIFEST.csv CHECKSUMS.sha256
      - name: Run final safety and manifest audit
        run: python scripts/audit_release.py --output "$RUNNER_TEMP/green-methanol-release-audit.json"
