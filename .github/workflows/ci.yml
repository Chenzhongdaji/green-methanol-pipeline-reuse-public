name: public-release-ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/requirements.txt
          python -m pip install -e .
      - name: Run release safety audit before inventory closure
        run: python scripts/audit_release.py --pre-manifest --output "$RUNNER_TEMP/green-methanol-pre-manifest-audit.json"
      - name: Run full public test suite
        run: python -m pytest -q
      - name: Run full public reproduction
        run: python scripts/reproduce.py --mode full --output "$RUNNER_TEMP/green-methanol-full"
      - name: Verify reproduction leaves the committed payload unchanged
        run: git diff --exit-code
      - name: Regenerate and verify deterministic release inventories
        run: |
          python scripts/build_manifest.py
          git diff --check
          git diff --exit-code -- FILE_MANIFEST.csv CHECKSUMS.sha256
      - name: Run final safety and manifest audit
        run: python scripts/audit_release.py --output "$RUNNER_TEMP/green-methanol-release-audit.json"
