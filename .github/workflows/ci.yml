name: public-release-ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/requirements.txt
          python -m pip install -e .
      - name: Run full public test suite
        run: python -m pytest -q
      - name: Run Level 1 smoke reproduction
        run: python scripts/reproduce.py --mode smoke --output "$RUNNER_TEMP/green-methanol-smoke.json"
      - name: Generate manifest and run final audit
        run: |
          python scripts/build_manifest.py
          python scripts/audit_release.py --output "$RUNNER_TEMP/green-methanol-release-audit.json"
